<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 브라우저 탭 제목: climb (REQ-NAME-02, v0.54 소문자) -->
  <title>climb</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="assets/img/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
  <!-- 로고 글자 climb만 SUITE 글꼴 (v0.53 기획자 요청, OFL 무료 글꼴) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUITE@2/fonts/static/woff2/SUITE.css">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <script src="assets/js/theme.js"></script><!-- 밝은 화면, 어두운 화면 (v0.53) -->
  <link rel="stylesheet" href="assets/css/common.css">
  <link rel="stylesheet" href="assets/css/form.css">
  <link rel="stylesheet" href="assets/css/list.css">
</head>
<!-- =====================================================================
  SCR-34 운영 검토 대기 (docs/02_화면목록.md)
  - 체결본 확인(⑧)이 끝난 계약 중 ⑨ 운영 적용(고객지원) 또는 ⑩ 재무 확인(재무) 차례인 건. ⑨ 다음 ⑩ (REQ-FLOW-28, REQ-SIGN-08)
  - 기획자 결정 2026-11-02 B-3(추천과 다름): 운영 변경도 ⑨ 다음 ⑩ 재무 확인(REQ-CHG-10). HR 충전의 ⑩은 ⑨를 한 재무 담당자가 아닌 재무 리더
  - 기획자 결정 2026-11-02 A-10: ⑨ 만료 처리(고객지원). 종료일이 지나고 연장이나 새 계약 기안이 없는 계약, 재무 확인 없음.
    누르면 계약 상세가 열리고 그 화면의 "만료 처리" 단추에서 처리(해지의 ⑨와 같은 확인 항목)
  - 체크리스트 4번(회계 영향 특수 조건)이 "예"인 계약은 표시합니다(REQ-CHK-08).
  - 최고관리자와 관리자는 모든 담당자의 차례를 담당자 칸과 함께 봅니다.
  - 휴대폰에서는 대기 일수를 고객사 아래 작은 줄에도 씁니다 (기획자 결정 2026-11-02 D-9, PC는 그대로)
  - 처리는 고객사를 눌러 결재 문서의 처리 막대에서 합니다(REQ-SIGN-02).
  - 거르기, 쪽 나누기는 assets/js/ops-queue.js가 처리합니다.
====================================================================== -->
<body data-page="SCR-34">
  <a class="skip-link" href="#main">본문 바로가기</a>
  <div id="demo-bar"></div>

  <div class="sheet">
  <header id="site-header"></header>

  <main id="main" class="page" tabindex="-1">
    <div class="inner">
      <div class="page-head page-head--sub">
        <h1 class="page-title">운영 검토 대기</h1>
      </div>
      <div class="page-intro">
        <p id="intro">내 차례인 운영 적용, 재무 확인, 만료 처리입니다. 오래 기다린 순서로 보여 줍니다.</p>
        <p class="sub">⑨ 운영 적용이 끝나면 ⑩ 재무 확인 차례가 되고, 둘 다 끝나면 계약 완료입니다. 운영 변경도 ⑩까지 거칩니다. 만료 처리는 종료일이 지나고 연장 기안이 없는 계약의 서비스를 닫는 차례입니다(재무 확인 없음). 한 단계에 <span data-rule="approvalDelayDays">5</span>일 이상 머문 건은 대기 일수를 강조합니다. 고객사를 누르면 결재 문서(만료 처리는 계약 상세)가 열립니다.</p>
      </div>

      <div id="notice"></div>

      <section id="list" aria-labelledby="list-title">
        <h2 class="sr-only" id="list-title">운영 검토 대기 목록</h2>
        <form class="filter-bar" id="filter" role="search" aria-label="운영 검토 대기 거르기">
          <div class="field">
            <label class="field-label field-label--sm" for="f-q">검색</label>
            <input class="input" id="f-q" type="search" placeholder="고객사 또는 계약번호" autocomplete="off">
          </div>
          <div class="field">
            <label class="field-label field-label--sm" for="f-step">단계</label>
            <select class="select" id="f-step"></select>
          </div>
          <div class="field">
            <label class="field-label field-label--sm" for="f-service">서비스</label>
            <select class="select" id="f-service"></select>
          </div>
          <div class="field">
            <label class="field-label field-label--sm" for="f-wait">대기</label>
            <select class="select" id="f-wait">
              <option value="">전체</option>
              <option value="LONG">5일 이상</option>
            </select>
          </div>
          <button type="reset" class="btn btn--tertiary btn--md filter-reset">초기화</button>
        </form>

        <div class="list-head"><p class="list-count" id="list-count" aria-live="polite"></p></div>
        <div class="tbl-scroll">
          <table class="tbl tbl--compact">
            <caption class="sr-only">운영 검토 대기 목록</caption>
            <thead id="thead"></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <nav class="pagination" id="pagination" aria-label="운영 검토 대기 쪽 이동"></nav>
      </section>
    </div>
  </main>

  <footer id="site-footer"></footer>
  </div><!-- /.sheet -->

  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/ops-queue.js"></script>
</body>
</html>
