<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 브라우저 탭 제목: climb (REQ-NAME-02, v0.54 소문자) -->
  <title>climb</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="assets/img/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
  <!-- 로고 글자 climb만 SUITE 글꼴 (v0.53 기획자 요청, OFL 무료 글꼴) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUITE@2/fonts/static/woff2/SUITE.css">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <script src="assets/js/theme.js"></script><!-- 밝은 화면, 어두운 화면 (v0.53) -->
  <link rel="stylesheet" href="assets/css/common.css">
  <link rel="stylesheet" href="assets/css/form.css">
  <link rel="stylesheet" href="assets/css/list.css">
</head>
<!-- =====================================================================
  SCR-21 검토 대기 (docs/02_화면목록.md)
  - 내 차례인 결재 단계 목록. 오래 기다린 순서로, 한 단계에 5일 이상 머문 건은 강조합니다. (REQ-DASH-05, REQ-REV-01)
  - ④ 법무와 ⑤ 개인정보는 동시에 차례가 될 수 있습니다. (REQ-STEP-04)
  - 승인 뒤 ⑥ 인장 날인(총무)과 ⑧ 체결본 확인(영업지원) 차례도 여기에 모읍니다. (REQ-SIGN-07, v0.23)
  - 최고관리자와 관리자는 모든 담당자의 차례를 담당자 칸과 함께 봅니다.
  - 거르기, 쪽 나누기는 assets/js/review-queue.js가 처리합니다.
====================================================================== -->
<body data-page="SCR-21">
  <a class="skip-link" href="#main">본문 바로가기</a>
  <div id="demo-bar"></div>

  <div class="sheet">
  <header id="site-header"></header>

  <main id="main" class="page" tabindex="-1">
    <div class="inner">
      <div class="page-head page-head--sub">
        <h1 class="page-title">검토 대기</h1>
      </div>
      <div class="page-intro">
        <p id="intro">내 차례인 결재입니다. 오래 기다린 순서로 보여 줍니다.</p>
        <p class="sub">한 단계에 5일 이상 머문 건은 대기 일수를 강조합니다. 고객사를 누르면 결재 문서가 열립니다.</p>
      </div>

      <div id="notice"></div>

      <section id="list" aria-labelledby="list-title">
        <h2 class="sr-only" id="list-title">검토 대기 목록</h2>
        <form class="filter-bar" id="filter" role="search" aria-label="검토 대기 거르기">
          <div class="field">
            <label class="field-label field-label--sm" for="f-q">검색</label>
            <input class="input" id="f-q" type="search" placeholder="고객사 또는 계약번호" autocomplete="off">
          </div>
          <div class="field">
            <label class="field-label field-label--sm" for="f-step">단계</label>
            <select class="select" id="f-step"></select>
          </div>
          <div class="field">
            <label class="field-label field-label--sm" for="f-service">서비스</label>
            <select class="select" id="f-service"></select>
          </div>
          <div class="field">
            <label class="field-label field-label--sm" for="f-wait">대기</label>
            <select class="select" id="f-wait">
              <option value="">전체</option>
              <option value="LONG">5일 이상</option>
            </select>
          </div>
          <button type="reset" class="btn btn--tertiary btn--md filter-reset">초기화</button>
        </form>

        <div class="list-head"><p class="list-count" id="list-count" aria-live="polite"></p></div>
        <div class="tbl-scroll">
          <table class="tbl tbl--compact">
            <caption class="sr-only">검토 대기 목록</caption>
            <thead id="thead"></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <nav class="pagination" id="pagination" aria-label="검토 대기 쪽 이동"></nav>
      </section>
    </div>
  </main>

  <footer id="site-footer"></footer>
  </div><!-- /.sheet -->

  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/review-queue.js"></script>
</body>
</html>
