<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 브라우저 탭 제목: CLIMB (REQ-NAME-02) -->
  <title>climb</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="assets/img/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
  <!-- 로고 글자 climb만 SUITE 글꼴 (v0.53 기획자 요청, OFL 무료 글꼴) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUITE@2/fonts/static/woff2/SUITE.css">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <script src="assets/js/theme.js"></script><!-- 밝은 화면, 어두운 화면 (v0.53) -->
  <link rel="stylesheet" href="assets/css/common.css">
  <link rel="stylesheet" href="assets/css/form.css">
  <link rel="stylesheet" href="assets/css/list.css">
  <link rel="stylesheet" href="assets/css/admin.css">
  <link rel="stylesheet" href="assets/css/board.css">
</head>
<!-- =====================================================================
  SCR-91 공지사항 (docs/02_화면목록.md, 요구사항 정의서 REQ-UI-29, v0.45 기획자 요청)
  - 주 메뉴 맨 끝. 공지와 릴리즈(새 기능, 개선, 바뀐 규칙, 고친 문제)를 한 게시판에서 구분으로 거름
  - 읽기는 모두, 글쓰기와 변경 이력은 관리자와 최고관리자만 (쓰기 창은 notice-form.js)
  - 중요 공지는 제목 앞에 "중요" 배지. 개요 맨 위에 가장 최근 글 한 줄, 중요 공지는 전체 사용자에게 이메일
====================================================================== -->
<body data-page="SCR-91">
  <a class="skip-link" href="#main">본문 바로가기</a>
  <div id="demo-bar"></div>

  <div class="sheet">
  <header id="site-header"></header>

  <main id="main" class="page" tabindex="-1">
    <div class="inner">
      <div class="page-head page-head--sub">
        <h1 class="page-title">공지사항</h1>
      </div>
      <div class="page-intro">
        <p>운영 공지와 릴리즈(새 기능, 개선, 바뀐 규칙, 고친 문제)를 알려 드립니다.</p>
        <p class="sub">중요 공지는 개요 맨 위에 보이고, 전체 사용자에게 이메일로도 보냅니다.</p>
      </div>

      <div class="admin-stack">
        <section class="panel" aria-labelledby="sec-list">
          <div class="panel-head panel-head--act">
            <h2 class="panel-title" id="sec-list">글 목록</h2>
            <button type="button" class="btn btn--primary btn--md" id="btn-write" hidden>글쓰기</button>
          </div>
          <!-- 다른 목록 화면처럼 윗줄 검색어(넓게) + 초기화, 아랫줄 구분 (2026-10-22 기획자 요청, PC와 태블릿)
               스마트폰에서는 검색, 구분, 초기화를 한 줄에 하나씩(검색 안내 글자가 잘리지 않게. board.css) -->
          <form class="filter-bar filter-bar--board" id="filter" role="search" aria-label="공지사항 거르기">
            <div class="field">
              <label class="field-label field-label--sm" for="f-q">검색</label>
              <input class="input" id="f-q" type="search" placeholder="제목, 버전, 내용" autocomplete="off">
            </div>
            <div class="field">
              <label class="field-label field-label--sm" for="f-kind">구분</label>
              <select class="select" id="f-kind">
                <option value="">전체</option>
                <option value="NOTICE">공지</option>
                <option value="RELEASE">릴리즈</option>
              </select>
            </div>
            <button type="reset" class="btn btn--tertiary btn--md filter-reset">초기화</button>
          </form>

          <div class="list-head"><p class="list-count" id="list-count" aria-live="polite"></p></div>
          <div class="tbl-scroll">
            <table class="tbl tbl--compact tbl--board">
              <caption class="sr-only">공지사항: 구분, 제목, 올린 날, 쓴 사람</caption>
              <thead>
                <tr>
                  <th scope="col" class="col-kind">구분</th>
                  <th scope="col">제목</th>
                  <th scope="col">올린 날</th>
                  <th scope="col">쓴 사람</th>
                </tr>
              </thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
          <nav class="pagination" id="pagination" aria-label="공지사항 쪽 이동"></nav>
        </section>

        <section class="panel" aria-labelledby="sec-history" id="history-wrap" hidden>
          <div class="panel-head"><h2 class="panel-title" id="sec-history">변경 이력</h2></div>
          <p class="panel-desc">관리자가 글을 올리고, 고치고, 내린 기록입니다. 고치거나 지울 수 없습니다.</p>
          <div id="history"></div>
        </section>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>
  </div><!-- /.sheet -->

  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/notice-form.js"></script>
  <script src="assets/js/notices.js"></script>
</body>
</html>
