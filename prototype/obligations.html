<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 브라우저 탭 제목: climb (REQ-NAME-02, v0.53 소문자) -->
  <title>climb</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="assets/img/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
  <!-- 로고 글자 climb만 SUITE 글꼴 (v0.53 기획자 요청, OFL 무료 글꼴) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUITE@2/fonts/static/woff2/SUITE.css">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <script src="assets/js/theme.js"></script><!-- 밝은 화면, 어두운 화면 (v0.53) -->
  <link rel="stylesheet" href="assets/css/common.css">
  <link rel="stylesheet" href="assets/css/form.css">
  <link rel="stylesheet" href="assets/css/list.css">
  <link rel="stylesheet" href="assets/css/admin.css">
</head>
<!-- =====================================================================
  SCR-48 의무 관리 (docs/02_화면목록.md, 요구사항 정의서 REQ-FLOW-33~36, v0.53 기획자 결정)
  - 보관함 메뉴. 계약을 맺은 뒤 지켜야 할 약속(보안 의무, SLA, 청구 일정)을 기한과 맡은 분야로 챙김
  - 거르기: 검색(고객사, 계약번호, 의무), 종류, 맡은 분야, 상태. 맡은 분야(정보보호, 고객지원, 재무)는 처음에 내 분야로 거름
  - 할 일: 기록 남기기(맡은 분야, 관리자), 기록 보기(모두), 끝내기(사유 필수). 의무 추가는 계약 상세(SCR-42)에서
    (기획자 결정 2026-11-02 D-15: "이행 기록" 단추를 "기록 남기기"로. 누르면 여는 창 "이행 기록을 남길까요?"는 그대로)
  - 열람 제한 계약은 맡은 분야에게 의무는 보이되 고객사는 가림
  - 동작은 assets/js/obligations.js, 창은 assets/js/obligation-ui.js
====================================================================== -->
<body data-page="SCR-48">
  <a class="skip-link" href="#main">본문 바로가기</a>
  <div id="demo-bar"></div>

  <div class="sheet">
  <header id="site-header"></header>

  <main id="main" class="page" tabindex="-1">
    <div class="inner">
      <div class="page-head page-head--sub">
        <h1 class="page-title">의무 관리</h1>
      </div>
      <div class="page-intro">
        <p>계약을 맺은 뒤 지켜야 할 약속(보안 의무, SLA, 청구 일정)을 기한과 맡은 분야로 챙깁니다. 하고 나면 이행 기록을 남깁니다.</p>
        <!-- 이메일 날은 결재선 규칙(SCR-52)에서 바꾼 값으로 채움(기획자 결정 2026-11-02 A-5, obligations.js) -->
        <p class="sub">기한 <span id="ob-mail-days">14일 전과 3일 전</span>에 맡은 분야에 이메일을 보내고, 기한이 지나면 다음 날 그 분야 리더에게도 알립니다. 의무는 계약 상세에서 더합니다.</p>
      </div>

      <section aria-labelledby="list-title">
        <h2 class="sr-only" id="list-title">의무 목록</h2>
        <form class="filter-bar" id="filter" role="search" aria-label="의무 거르기">
          <div class="field">
            <label class="field-label field-label--sm" for="f-q">검색</label>
            <input class="input" id="f-q" type="search" placeholder="고객사, 계약번호, 의무" autocomplete="off">
          </div>
          <div class="field">
            <label class="field-label field-label--sm" for="f-kind">종류</label>
            <select class="select" id="f-kind"></select>
          </div>
          <div class="field">
            <label class="field-label field-label--sm" for="f-owner">맡은 분야</label>
            <select class="select" id="f-owner"></select>
          </div>
          <div class="field">
            <label class="field-label field-label--sm" for="f-state">상태</label>
            <select class="select" id="f-state"></select>
          </div>
          <button type="reset" class="btn btn--tertiary btn--md filter-reset">초기화</button>
        </form>

        <div class="list-head"><p class="list-count" id="list-count" aria-live="polite"></p></div>
        <div class="tbl-scroll" tabindex="0" role="region" aria-label="의무 표">
          <table class="tbl tbl--compact">
            <caption class="sr-only">의무: 다음 기한과 상태, 의무, 계약, 맡은 분야, 할 일</caption>
            <thead><tr><th scope="col">다음 기한</th><th scope="col">의무</th><th scope="col">계약</th><th scope="col" class="col-owner">맡은 분야</th><th scope="col" class="col-action">할 일</th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <footer id="site-footer"></footer>
  </div><!-- /.sheet -->

  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/obligation-ui.js"></script>
  <script src="assets/js/obligations.js"></script>
</body>
</html>
