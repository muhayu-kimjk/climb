<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 브라우저 탭 제목: climb (REQ-NAME-02, v0.54 소문자) -->
  <title>climb</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="assets/img/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
  <!-- 로고 글자 climb만 SUITE 글꼴 (v0.53 기획자 요청, OFL 무료 글꼴) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUITE@2/fonts/static/woff2/SUITE.css">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <script src="assets/js/theme.js"></script><!-- 밝은 화면, 어두운 화면 (v0.53) -->
  <link rel="stylesheet" href="assets/css/common.css">
  <link rel="stylesheet" href="assets/css/form.css">
  <link rel="stylesheet" href="assets/css/list.css">
  <link rel="stylesheet" href="assets/css/review.css">
</head>
<!-- =====================================================================
  SCR-47 계약 요약서 (docs/02_화면목록.md, 요구사항 정의서 REQ-ARC-09, v0.53 기획자 요청)
  - 계약 상세(SCR-42)의 "계약 요약서" 버튼으로 엶. 메뉴에는 없음(보관함 > 전체 계약 아래로 표시)
  - 계약 한 묶음(원계약 + 변경, 연장, 해지)을 A4 문서 한 벌로: 계약 개요, 계약마다 금액과 체크리스트, 결재 기록, 체결본 목록, 체결 후 의무(v0.53), 사후관리 기록
    기획자 결정 2026-11-02 D-6: 2번 묶음 이름 "차수와 금액"을 "계약 이력과 금액"으로(계약 상세의 "계약 이력"과 맞춤)
  - 인쇄하면 출력자 이름과 일시 워터마크가 찍힘(REQ-SEC-07). 제품 줄과 첨부 파일은 계약마다 결재 문서(SCR-23)에
  - 볼 수 있는 사람은 계약 상세와 같음(열람 제한 건은 권한자만)
  - 동작은 assets/js/contract-print.js
====================================================================== -->
<body data-page="SCR-47">
  <a class="skip-link" href="#main">본문 바로가기</a>
  <div id="demo-bar"></div>

  <div class="sheet">
  <header id="site-header"></header>

  <main id="main" class="page" tabindex="-1">
    <div class="inner">
      <div class="page-head page-head--sub">
        <div>
          <p class="doc-kind">계약 요약서</p>
          <h1 class="page-title" id="doc-title">계약 요약서</h1>
          <p class="doc-meta" id="doc-meta"></p>
        </div>
        <div class="doc-tools no-print" id="doc-tools" hidden>
          <button type="button" class="btn btn--primary btn--md" id="btn-print">A4로 인쇄</button>
        </div>
      </div>

      <div id="notice"></div>

      <div class="doc-stack" id="doc" hidden>
        <section class="panel" aria-labelledby="sum-title">
          <h2 class="section-title" id="sum-title"><span class="num">1</span>계약 개요</h2>
          <dl class="info-grid" id="summary"></dl>
        </section>

        <!-- 표가 든 묶음(2, 4, 5, 6)은 panel--flow: 길면 쪽을 넘겨 찍음. 묶음째 다음 쪽으로 밀려 빈 쪽이 생기지 않게 (2026-11-06 점검, review.css 인쇄) -->
        <section class="panel panel--flow" aria-labelledby="rounds-title">
          <h2 class="section-title" id="rounds-title"><span class="num">2</span>계약 이력과 금액</h2><!-- D-6(2026-11-02), 예전 "차수와 금액" -->
          <p class="section-desc">원계약과 변경, 연장, 해지를 기안한 순서대로 적습니다. 금액은 부가세 별도입니다. 체크리스트 1번은 표준계약서 사용, 2번은 표준단가표 적용, 3번은 할인율 한도 지킴, 4번은 회계에 영향을 주는 특수 조건이 있는지 묻는 문항입니다.</p>
          <div class="tbl-wrap"><table class="tbl tbl--compact" id="rounds"></table></div>
        </section>

        <section class="panel panel--flow" aria-labelledby="appr-title">
          <h2 class="section-title" id="appr-title"><span class="num">3</span>결재 기록</h2>
          <p class="section-desc">계약마다 거친 단계와 처리한 사람, 일시, 의견입니다. 거치지 않은 단계는 적지 않습니다.</p><!-- D-6: 묶음 이름만 "계약 이력"으로 바꿈. 번호에 붙는 차수(REQ-FLOW-18)는 그대로 -->
          <div id="approvals"></div>
        </section>

        <section class="panel panel--flow" aria-labelledby="signed-title">
          <h2 class="section-title" id="signed-title"><span class="num">4</span>체결본</h2>
          <div class="tbl-wrap"><table class="tbl tbl--compact" id="signed"></table></div>
        </section>

        <!-- 체결 후 의무 (v0.53 기획자 결정, REQ-FLOW-33~36) -->
        <section class="panel panel--flow" aria-labelledby="ob-title">
          <h2 class="section-title" id="ob-title"><span class="num">5</span>체결 후 의무</h2>
          <div class="tbl-wrap"><table class="tbl tbl--compact" id="obligations"></table></div>
        </section>

        <section class="panel panel--flow" aria-labelledby="notes-title">
          <h2 class="section-title" id="notes-title"><span class="num">6</span>사후관리 기록</h2>
          <div class="tbl-wrap"><table class="tbl tbl--compact" id="notes"></table></div>
        </section>

        <p class="doc-endnote" id="endnote"></p>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>
  </div><!-- /.sheet -->

  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/contract-print.js"></script>
</body>
</html>
