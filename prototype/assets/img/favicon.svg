<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -16 283 283">
  <!-- 무하유 심볼 파비콘 (REQ-UI-03)
       기획자가 대화창에 붙여 준 이미지를 보고 같은 모양으로 다시 그린 근사본입니다.
       원본 이미지 파일(SVG 또는 PNG)을 받으면 이 파일을 원본으로 교체해야 합니다. -->
  <!-- 바탕: 무하유 Green 대각선 캡슐 -->
  <line x1="68" y1="184" x2="215" y2="70" stroke="#11BE8A" stroke-width="136" stroke-linecap="round"/>
  <!-- 흰 무늬 테두리(초록): 캡슐 밖으로 나온 부분도 보이게 함 -->
  <g fill="#11BE8A" stroke="#11BE8A" stroke-linecap="round">
    <circle cx="76" cy="77" r="22"/>
    <line x1="120" y1="78" x2="196" y2="78" stroke-width="56"/>
    <line x1="84" y1="116" x2="194" y2="116" stroke-width="56"/>
    <line x1="84" y1="154" x2="198" y2="154" stroke-width="56"/>
    <circle cx="78" cy="201" r="22"/>
    <line x1="118" y1="201" x2="134" y2="201" stroke-width="44"/>
    <line x1="172" y1="201" x2="200" y2="201" stroke-width="44"/>
  </g>
  <!-- 흰 무늬: 작은 점, 세 줄 막대, 아래 점과 막대 -->
  <g fill="#FFFFFF" stroke="#FFFFFF" stroke-linecap="round">
    <circle cx="76" cy="77" r="14" stroke="none"/>
    <line x1="120" y1="78" x2="196" y2="78" stroke-width="40"/>
    <line x1="84" y1="116" x2="194" y2="116" stroke-width="40"/>
    <line x1="84" y1="154" x2="198" y2="154" stroke-width="40"/>
    <circle cx="78" cy="201" r="14" stroke="none"/>
    <line x1="118" y1="201" x2="134" y2="201" stroke-width="28"/>
    <circle cx="172" cy="201" r="14" stroke="none"/>
    <circle cx="200" cy="201" r="14" stroke="none"/>
    <rect x="172" y="196" width="28" height="10" stroke="none"/>
  </g>
</svg>
