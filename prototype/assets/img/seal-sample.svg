<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="시연용 회사 인장 견본">
  <!-- 기획자 결정 2026-11-02 E-7: "견적서 출력"에 찍는 회사 인장 그림의 시연용 견본. 실제 인장이 아님("견본" 글자). 실제 그림은 총무가 회사 설정(SCR-59)에서 올림 -->
  <g fill="none" stroke="#c8322b">
    <circle cx="50" cy="50" r="46" stroke-width="4"/>
    <circle cx="50" cy="50" r="37" stroke-width="1.5"/>
  </g>
  <g fill="#c8322b" font-family="'Noto Sans KR', sans-serif" text-anchor="middle" font-weight="700">
    <text x="50" y="31" font-size="10">회사 인장</text>
    <text x="50" y="60" font-size="22">견본</text>
    <text x="50" y="78" font-size="9">시연용</text>
  </g>
</svg>
