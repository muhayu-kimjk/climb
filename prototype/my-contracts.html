<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 브라우저 탭 제목: CLIMB (REQ-NAME-02) -->
  <title>CLIMB</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="assets/img/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/common.css">
  <link rel="stylesheet" href="assets/css/form.css">
  <link rel="stylesheet" href="assets/css/list.css">
</head>
<!-- =====================================================================
  SCR-12 내 등록 목록 (docs/02_화면목록.md)
  - 내가 등록한 모든 계약(작성 중, 검토 중, 반려, 체결 대기, 운영 검토, 계약 완료, 변경, 갱신, 해지 기안). (REQ-ARC-04)
  - 할 일: 작성 중 → 이어서 작성, 삭제(REQ-FLOW-31) / 반려 → 보완 후 재기안 / ⑦ 내 차례 → 체결본 등록
  - 슈퍼관리자와 관리자는 모든 영업의 목록을 영업 대표 칸과 함께 봅니다.
  - 거르기, 쪽 나누기, 임시 저장 삭제 확인 창은 assets/js/my-contracts.js가 처리합니다.
====================================================================== -->
<body data-page="SCR-12">
  <a class="skip-link" href="#main">본문 바로가기</a>
  <div id="demo-bar"></div>

  <div class="sheet">
  <header id="site-header"></header>

  <main id="main" class="page">
    <div class="inner">
      <div class="page-head page-head--sub">
        <h1 class="page-title">내 등록 목록</h1>
      </div>
      <div class="page-intro">
        <p id="intro">내가 등록한 계약입니다. 최근에 기안하거나 저장한 것부터 보여 줍니다.</p>
        <p class="sub">임시 저장한 계약은 나만 보고, 기안 전이면 지울 수 있습니다. 기안한 뒤에는 어떤 계약도 지울 수 없습니다.</p>
      </div>

      <div id="notice"></div>

      <section id="list" aria-labelledby="list-title">
        <h2 class="sr-only" id="list-title">내 등록 목록</h2>
        <form class="filter-bar" id="filter" role="search" aria-label="내 등록 목록 거르기">
          <div class="field">
            <label class="field-label field-label--sm" for="f-q">검색</label>
            <input class="input" id="f-q" type="search" placeholder="고객사 또는 계약번호" autocomplete="off">
          </div>
          <div class="field">
            <label class="field-label field-label--sm" for="f-status">상태</label>
            <select class="select" id="f-status"></select>
          </div>
          <div class="field">
            <label class="field-label field-label--sm" for="f-kind">구분</label>
            <select class="select" id="f-kind"></select>
          </div>
          <button type="reset" class="btn btn--tertiary btn--md filter-reset">초기화</button>
        </form>

        <div class="list-head"><p class="list-count" id="list-count" aria-live="polite"></p></div>
        <div class="tbl-scroll">
          <table class="tbl tbl--compact">
            <caption class="sr-only">내 등록 목록: 고객사, 구분, 상태, 현재 진행, 기안일, 할 일</caption>
            <thead id="thead"></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <nav class="pagination" id="pagination" aria-label="내 등록 목록 쪽 이동"></nav>
      </section>
    </div>
  </main>

  <footer id="site-footer"></footer>
  </div><!-- /.sheet -->

  <!-- 임시 저장 삭제 확인 창 (REQ-FLOW-31) -->
  <div class="modal-backdrop" id="del-modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="del-title">
      <h2 class="modal-title" id="del-title">임시 저장한 계약을 지울까요?</h2>
      <div class="modal-body"><p id="del-desc"></p></div>
      <div class="modal-actions">
        <button type="button" class="btn btn--tertiary btn--md" data-act="close">닫기</button>
        <button type="button" class="btn btn--danger btn--md" data-act="confirm">지우기</button>
      </div>
    </div>
  </div>

  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/my-contracts.js"></script>
</body>
</html>
