<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 브라우저 탭 제목: climb (REQ-NAME-02, v0.54 소문자) -->
  <title>climb</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="assets/img/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
  <!-- 로고 글자 climb만 SUITE 글꼴 (v0.53 기획자 요청, OFL 무료 글꼴) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUITE@2/fonts/static/woff2/SUITE.css">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <script src="assets/js/theme.js"></script><!-- 밝은 화면, 어두운 화면 (v0.53) -->
  <link rel="stylesheet" href="assets/css/common.css">
</head>
<!-- =====================================================================
  SCR-00 로그인 (docs/02_화면목록.md)
  - 회사 Google 계정으로 로그인합니다. 회사 도메인 계정만 허용합니다. (REQ-ENV-03)
  - 사내망 또는 VPN에서만 접속할 수 있습니다(REQ-ENV-02). 화면에는 적지 않음 (v0.31 기획자 결정)
  - (v0.31 기획자 결정) 화면에 로고 글자(climb)를 두지 않고 한글 이름과 영문 이름만, 안내는 @muhayu.com 계정 한 줄만
  - 프로토타입: 버튼을 누르면 실제 인증 없이 아래에서 고른 역할로 대시보드에 들어갑니다.
  - 개발팀 참고: Google OAuth 2.0 / OpenID Connect. 허용 도메인(hd) 검증은 반드시 서버에서 합니다.
====================================================================== -->
<body class="login-page" data-page="SCR-00">
  <main class="login-wrap">
    <section class="login-card" aria-label="로그인">
      <!-- 시스템 이름: 로고 그림 없이 글자로만. 로고 글자(climb) 없이 한글 이름과 영문 이름 (REQ-NAME-03~04, v0.31) -->
      <div class="login-brand" id="login-brand"></div>

      <button type="button" class="btn btn--lg btn--google" id="google-login">
        <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Google 계정으로 로그인
      </button>
      <p class="login-help">@muhayu.com 계정만 사용할 수 있습니다.</p>
      <!-- 보안 안내 문구: 접속하기 전에 보이도록 로그인 버튼 아래에 둠 (REQ-UI-15). 문장은 common.js SECURITY_NOTICE -->
      <p class="login-notice" id="login-notice"></p>

      <!-- 프로토타입 시연용: 실제 시스템에서는 삭제 -->
      <div class="demo-box">
        <label for="login-role">시연용 역할 선택 (프로토타입 전용)</label>
        <select id="login-role" class="demo-select" autocomplete="off"></select>
      </div>
    </section>
    <p class="login-foot" id="login-foot"></p>
  </main>

  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/common.js"></script>
  <script>
    (function () {
      const D = window.CLIMB_DATA;
      const C = window.CLIMB;
      const role = C.getRole();

      // 이름 영역: 무하유 계약 관리 시스템 + 영문 명칭. 로고 글자(climb)는 두지 않음 (REQ-NAME-03~04, v0.31)
      document.getElementById('login-brand').innerHTML =
        '<h1 class="brand-title"><span class="brand-ko">' + C.esc(D.BRAND.ko) + '</span></h1><span class="brand-en">' + C.esc(D.BRAND.en) + '</span>';
      document.getElementById('login-notice').textContent = C.securityNotice;
      document.getElementById('login-foot').innerHTML =
        C.meta(['© 2026 ' + D.BRAND.company + ' All rights reserved.']);

      // 시연용 역할 목록
      const select = document.getElementById('login-role');
      // 역할 2단계: 분야마다 묶음 (v0.29)
      select.innerHTML = D.ROLE_AREAS.map(function (g) {
        return '<optgroup label="' + C.esc(g.name) + '">' + Object.keys(g.roles).map(function (r) {
          const u = D.USERS[D.DEMO_PERSONA[r]];
          return '<option value="' + r + '"' + (r === role ? ' selected' : '') + '>' + C.esc(D.ROLES[r]) + ' (' + C.esc(u.name) + ')</option>';
        }).join('') + '</optgroup>';
      }).join('');

      // 로그인 → 대시보드 (실제로는 Google 인증 후 서버가 역할을 확인)
      document.getElementById('google-login').addEventListener('click', function () {
        C.saveRole(select.value);
        location.href = 'index.html?role=' + select.value;
      });
    })();
  </script>
</body>
</html>
