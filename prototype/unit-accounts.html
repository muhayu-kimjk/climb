<!-- =====================================================================
  SCR-94 유닛 계정 확인 (docs/02_화면목록.md에 더할 것) (기획자 결정 2026-11-09 5회차 5번)
  - 분기 권한 검토 때 정보보호 담당자가 유닛 리더에게 "유닛 계정 목록을 확인해 주세요" 이메일(계정 수만)을 보내면,
    리더가 메일의 버튼으로 이 화면에 들어옵니다. 직원 정보는 메일로 나가지 않고 시스템 안에서만 봅니다.
  - 리더는 확인 요청을 받은 자기 유닛의 계정만 봅니다(이름, 이메일, 역할, 상태, 마지막 로그인). 다른 유닛은 보이지 않습니다.
  - "확인함"을 누르면 확인한 사람, 일시, 그때 본 계정, 적은 이상한 계정(선택)이 남고 고칠 수 없습니다.
    정보보호 담당자는 접속 기록 점검(SCR-57)의 분기 권한 검토 자료에서 유닛마다 확인 여부를 봅니다.
  - 기획자 결정 2026-11-10 19번: 대리 지정 기간에는 리더의 대신할 사람도 그 유닛을 보고 "확인함"을 남깁니다. 기록과 화면에 "누구 대신"이 남습니다.
  - 기획자 결정 2026-11-10 21번(5회차 15번의 인사 명단 파일을 갈음): 확인할 때 계정마다 "퇴사", "휴직", "이동"을 표시할 수 있습니다(선택, 짧은 메모).
    표시한 계정은 정보보호 담당자의 분기 권한 검토에 "조치할 계정"으로 올라갑니다.
  - 메뉴에는 없습니다. 주소: unit-accounts.html?q=2026-Q3 (분기). 동작은 assets/js/unit-accounts.js
====================================================================== -->

    <div class="inner">
      <div class="page-head page-head--sub">
        <h1 class="page-title">유닛 계정 확인</h1>
      </div>
      <div class="page-intro">
        <p>분기 권한 검토 때 정보보호 담당자가 확인을 요청한 내 유닛의 계정입니다. 이름, 역할, 상태가 지금 하는 일에 맞는지 보고 "확인함"을 남깁니다.</p>
        <!-- 기획자 결정 2026-11-10 19번(대리 지정 기간에는 대신할 사람도), 21번(계정마다 퇴사, 휴직, 이동 표시) -->
        <p class="sub">확인을 요청받은 유닛의 계정만 보입니다. 대리 지정 기간에는 리더를 대신할 사람도 확인을 남길 수 있고, 누구 대신인지 함께 남습니다. 퇴사, 휴직, 이동한 사람은 확인할 때 표시하고, 하는 일과 맞지 않는 역할은 적습니다. 남긴 확인은 고칠 수 없습니다.</p>
      </div>
