<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 브라우저 탭 제목: CLIMB (REQ-NAME-02) -->
  <title>CLIMB</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <!-- 글꼴: Noto Sans KR (REQ-UI-02)
       사내망에서 Google Fonts 접속이 막혀 있으면 글꼴 파일을 서버에 직접 두는 방식으로 바꿔야 합니다. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/common.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
</head>
<!-- =====================================================================
  SCR-01 개요 (docs/02_화면목록.md, 대시보드)
  - 로그인 후 첫 화면입니다. (REQ-DASH-01)
  - 전체 계약 현황(REQ-DASH-02, 04, 08)과 내가 검토할 계약(REQ-DASH-03, 05)을 보여줍니다.
  - 역할에 따라 구성이 달라집니다. (REQ-AUTH-04)
  - 아래 빈 영역은 assets/js/dashboard.js가 예시 데이터로 채웁니다.
====================================================================== -->
<body data-page="SCR-01">
  <a class="skip-link" href="#main">본문 바로가기</a>

  <!-- 프로토타입 시연 띠: 실제 시스템에서는 삭제 -->
  <div id="demo-bar"></div>

  <!-- A4 세로 종이 틀: 헤더부터 푸터까지 A4 한 장처럼 담음 (REQ-UI-10) -->
  <div class="sheet">

  <!-- 헤더 + 메인 메뉴 (common.js가 그림) -->
  <header id="site-header"></header>

  <main id="main" class="page">
    <div class="inner">
      <!-- 개요 화면은 큰 제목 없이 인사말로 시작 (REQ-DASH-13). 제목은 화면낭독기용으로만 둠 -->
      <div class="page-head">
        <div>
          <h1 class="sr-only">개요</h1>
          <p class="page-desc page-lead" id="greeting"></p>
        </div>
        <p class="page-date" id="today"></p>
      </div>

      <!-- 핵심 숫자: 내 할 일 / 전체 진행 현황 / 만료 예정 (REQ-DASH-04, REQ-DASH-08) -->
      <section class="kpi" id="kpi" aria-label="계약 현황 요약"></section>

      <div class="dash-grid">
        <!-- 역할별 주요 목록 (REQ-DASH-03, 05, 06) -->
        <section class="panel" id="main-list" aria-labelledby="main-list-title"></section>

        <div class="side-stack">
          <!-- 확인 필요 [제안] (REQ-DASH-09) -->
          <section class="panel" id="checks" aria-labelledby="checks-title"></section>
          <!-- 만료 임박 (REQ-DASH-07) -->
          <section class="panel" id="expiring" aria-labelledby="expiring-title"></section>
        </div>
      </div>
    </div>
  </main>

  <!-- 푸터 (common.js가 그림) -->
  <footer id="site-footer"></footer>

  </div><!-- /.sheet -->

  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/dashboard.js"></script>
</body>
</html>
